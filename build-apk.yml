name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pasang dependensi
        run: npm install
      - name: Tambah proyek Android
        run: npx cap add android
      - name: Buat ikon aplikasi (boleh gagal, ikon bawaan dipakai)
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Samakan versionCode dengan nomor build
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Pakai kunci tanda tangan tetap (supaya bisa update tanpa hapus aplikasi)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Sinkronkan web ke Android
        run: npx cap sync android
      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Buat Release berisi APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BukuPoin.apk
          gh release create "apk-${{ github.run_number }}" BukuPoin.apk --title "Buku Poin build ${{ github.run_number }}" --notes "APK untuk dipasang di Android."
